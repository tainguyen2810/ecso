# Nginx inside the ECSO container. TLS and the domain are handled by the proxy in front (aaPanel/Cloudflare).
server {
    listen 8080 default_server;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20m;
    server_tokens off;

    location ~ /\.(?!well-known) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /storage/ {
        expires 7d;
        access_log off;
        try_files $uri =404;
    }

    location ~ \.php$ {
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 90s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location = /health/ready { access_log off; try_files $uri /index.php?$query_string; }
    location = /health { access_log off; try_files $uri /index.php?$query_string; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
