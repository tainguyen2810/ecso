name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DB_CONNECTION: mysql
  DB_HOST: 127.0.0.1
  DB_PORT: 3306
  DB_USERNAME: root
  DB_PASSWORD: root
  REDIS_HOST: 127.0.0.1

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecso_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pcntl, pdo_mysql, redis, zip
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: vendor/bin/pint --test
      - run: vendor/bin/phpstan analyse --memory-limit=1G --no-progress
      - name: Dependency advisories (PHP)
        run: composer audit --no-interaction
      - run: php artisan test
        env:
          DB_DATABASE: ecso_test
      - name: Concurrency tests (multi-process, real MySQL locks)
        run: php artisan test --group=concurrency
        env:
          DB_DATABASE: ecso_test

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Dependency advisories (JS shipped to browsers)
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npx vite build

  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: ecso
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
      redis:
        image: redis:7
        ports: ['6379:6379']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, pcntl, pdo_mysql, redis, zip
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: npm ci && npx vite build
      - run: npx playwright install --with-deps chromium
      - name: Prepare app
        run: |
          cp .env.example .env
          sed -i 's/^QUEUE_CONNECTION=.*/QUEUE_CONNECTION=sync/; s/^APP_URL=.*/APP_URL=http:\/\/127.0.0.1:8000/' .env
          php artisan key:generate
          php artisan migrate --seed --force
          php artisan db:seed --class=DemoSeeder --force
        env:
          DB_DATABASE: ecso
      - name: Run E2E
        run: |
          php artisan serve --host=127.0.0.1 --port=8000 > /tmp/serve.log 2>&1 &
          sleep 3
          npx playwright test
        env:
          DB_DATABASE: ecso
      - name: Setup wizard E2E (fresh copy without .env)
        run: |
          mysql -h127.0.0.1 -uroot -proot -e "CREATE DATABASE ecso_wizard CHARACTER SET utf8mb4 COLLATE utf8mb4_unicode_ci"
          INSTALL_DB_DATABASE=ecso_wizard INSTALL_DB_USERNAME=root INSTALL_DB_PASSWORD=root scripts/e2e-install.sh
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
