; Scheduler as a supervised process (alternative: cron "* * * * * www php /www/wwwroot/ecso/current/artisan schedule:run").
[program:ecso-scheduler]
process_name=%(program_name)s
command=/usr/bin/php /www/wwwroot/ecso/current/artisan schedule:work
directory=/www/wwwroot/ecso/current
user=www
autostart=true
autorestart=true
stopwaitsecs=60
redirect_stderr=true
stdout_logfile=/www/wwwroot/ecso/shared/storage/logs/scheduler.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
