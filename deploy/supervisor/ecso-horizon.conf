; Supervisor program for queue workers (aaPanel → Supervisor plugin, or /etc/supervisor/conf.d/).
; Runs as the web user, restarts automatically; never start workers from an SSH session.
[program:ecso-horizon]
process_name=%(program_name)s
command=/usr/bin/php /www/wwwroot/ecso/current/artisan horizon
directory=/www/wwwroot/ecso/current
user=www
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
; Let running jobs finish on deploy (horizon:terminate) before being killed.
stopwaitsecs=3600
redirect_stderr=true
stdout_logfile=/www/wwwroot/ecso/shared/storage/logs/horizon.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
