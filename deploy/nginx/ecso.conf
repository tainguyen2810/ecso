# Nginx server block (aaPanel: Website → ecso → Config). SSL/HSTS are set by aaPanel's SSL tab ("Force HTTPS").
server {
    listen 443 ssl http2;
    server_name app.example.vn;            # replace
    root /www/wwwroot/ecso/current/public;
    index index.php;

    client_max_body_size 20m;              # product import files
    server_tokens off;

    # Never serve dotfiles or app internals.
    location ~ /\.(?!well-known) { deny all; }
    location ~* ^/(storage/logs|vendor|\.env|composer\.(json|lock)) { deny all; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Built assets are fingerprinted: cache long.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-83.sock;   # aaPanel PHP 8.3 socket
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 60s;
    }

    # Readiness endpoint is token protected by the app; keep it off public logs.
    location = /health/ready { access_log off; try_files $uri /index.php?$query_string; }
}
